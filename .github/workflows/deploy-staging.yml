name: Deploy Staging

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: keva_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d keva_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KEVA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/keva_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --audit-level high

      - name: Verify staging database target
        working-directory: packages/core
        run: |
          node --input-type=module <<'EOF'
          import postgres from "postgres";

          const expected = {
            database: "neondb",
            projectId: "withered-frost-06416477",
            branchId: "br-square-breeze-aozv0kgz",
          };

          const sql = postgres(process.env.DATABASE_URL, { max: 1 });
          try {
            const [target] = await sql`
              SELECT
                current_database() AS database,
                current_setting('neon.project_id', true) AS project_id,
                current_setting('neon.branch_id', true) AS branch_id
            `;

            console.log(`Database: ${target.database}`);
            console.log(`Neon project: ${target.project_id}`);
            console.log(`Neon branch: ${target.branch_id}`);

            if (
              target.database !== expected.database ||
              target.project_id !== expected.projectId ||
              target.branch_id !== expected.branchId
            ) {
              throw new Error(
                `STAGING_DATABASE_URL must point to ${expected.projectId}/${expected.branchId}/${expected.database}`,
              );
            }
          } finally {
            await sql.end();
          }
          EOF
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Run staging database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Deploy Cloudflare staging Worker
        run: pnpm exec wrangler deploy --config apps/server/wrangler.toml --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test staging health endpoint
        run: curl --fail --silent --show-error https://staging.usekeva.com/health
