name: Deploy Production

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.1.0)"
        required: false
        type: string

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: keva_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d keva_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KEVA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/keva_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Resolve build metadata
        run: |
          echo "KEVA_APP_COMMIT=${{ github.sha }}" >> "$GITHUB_ENV"
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "KEVA_APP_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          elif [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" =~ ^v ]]; then
            echo "KEVA_APP_VERSION=${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi

      - name: Validate release tag format
        if: github.ref_type == 'tag'
        run: |
          if ! [[ "$KEVA_APP_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag: $KEVA_APP_VERSION"
            echo "Expected vX.Y.Z (e.g. v0.1.0)"
            exit 1
          fi

      - run: pnpm build
        env:
          KEVA_ENVIRONMENT: production

      - run: pnpm audit --audit-level high

      - name: Migrate production database
        run: pnpm --filter @keva/core db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy Cloudflare production Worker
        run: pnpm exec wrangler deploy --config apps/server/wrangler.toml --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Cloudflare landing site
        run: pnpm exec wrangler deploy --config apps/landing/wrangler.toml --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test production health endpoint
        run: |
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 https://app.usekeva.com/health
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 https://api.usekeva.com/health
          test "$(curl --silent --retry 30 --retry-all-errors --retry-delay 2 --output /dev/null --write-out "%{http_code}" https://api.usekeva.com/v1/usage)" = "401"
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 https://usekeva.com/
