name = "keva-server"
main = "src/worker.ts"
compatibility_date = "2026-06-20"
compatibility_flags = ["nodejs_compat", "enable_request_signal"]

[[containers]]
class_name = "MediaContainer"
image = "../../Dockerfile.media-worker"
instance_type = "standard-1"
max_instances = 2

[[durable_objects.bindings]]
name = "REALTIME"
class_name = "RealtimeHub"

[[durable_objects.bindings]]
name = "MEDIA"
class_name = "MediaContainer"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "6458d8de93be4e7090f5bfc0872798a8"
localConnectionString = "postgres://postgres:postgres@127.0.0.1:5432/keva"

[vars]
KEVA_BASE_URL = "http://localhost:5173"
KEVA_TENANT_ID = "local"
KEVA_ENVIRONMENT = "development"
THUMBNAIL_JOBS_ENABLED = "true"
MEDIA_DATABASE_URL = "postgres://postgres:postgres@host.docker.internal:5432/keva"
# Bypass Wrangler's local Container sidecar, which times out with Tailscale's src_valid_mark=1.
# Production and staging continue to use the MediaContainer binding. See cloudflare/workerd#6860.
MEDIA_WORKER_URL = "http://127.0.0.1:8080"

[[migrations]]
tag = "v1_realtime_hub"
new_sqlite_classes = ["RealtimeHub"]

[[migrations]]
tag = "v2_media_container"
new_sqlite_classes = ["MediaContainer"]

[triggers]
crons = ["*/5 * * * *", "0 0 * * *"]

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[env.staging]
name = "keva-staging"

[[env.staging.containers]]
class_name = "MediaContainer"
image = "../../Dockerfile.media-worker"
instance_type = "standard-1"
max_instances = 2

[[env.staging.durable_objects.bindings]]
name = "REALTIME"
class_name = "RealtimeHub"

[[env.staging.durable_objects.bindings]]
name = "MEDIA"
class_name = "MediaContainer"

[env.staging.vars]
KEVA_BASE_URL = "https://staging.usekeva.com"
BETTER_AUTH_URL = "https://staging.usekeva.com"
KEVA_TRUSTED_ORIGINS = "https://staging.usekeva.com"
KEVA_TENANT_ID = "staging"
KEVA_ENVIRONMENT = "staging"
THUMBNAIL_JOBS_ENABLED = "true"
THUMBNAIL_GRID_ENABLED = "true"
S3_ENDPOINT = "https://90203c49970ccbafedc99866c91c1b9f.r2.cloudflarestorage.com"
S3_REGION = "auto"
S3_BUCKET = "keva-staging"
S3_FORCE_PATH_STYLE = "true"
POLAR_SERVER = "sandbox"
POLAR_PRODUCT_100GB_ID = "40b01c2d-f8ff-4d11-a41e-32a63c15d612"
POLAR_PRODUCT_500GB_ID = "b1422267-bf7f-427a-b0ea-8fc7d9db5a00"
POLAR_PRODUCT_1TB_ID = "46f14277-b2bd-4b35-ba97-b4bb4cfab7dc"
POLAR_PRODUCT_2TB_ID = "b3e06bed-0b77-431b-9244-bc17a6f5b12b"

[[env.staging.routes]]
pattern = "staging.usekeva.com"
custom_domain = true

[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
id = "6458d8de93be4e7090f5bfc0872798a8"

[env.production]
name = "keva-production"

[[env.production.containers]]
class_name = "MediaContainer"
image = "../../Dockerfile.media-worker"
instance_type = "standard-1"
max_instances = 2

[[env.production.durable_objects.bindings]]
name = "REALTIME"
class_name = "RealtimeHub"

[[env.production.durable_objects.bindings]]
name = "MEDIA"
class_name = "MediaContainer"

[env.production.vars]
KEVA_BASE_URL = "https://app.usekeva.com"
BETTER_AUTH_URL = "https://app.usekeva.com"
KEVA_TRUSTED_ORIGINS = "https://app.usekeva.com"
KEVA_PUBLIC_API_HOST = "api.usekeva.com"
KEVA_TENANT_ID = "production"
KEVA_ENVIRONMENT = "production"
THUMBNAIL_JOBS_ENABLED = "true"
THUMBNAIL_GRID_ENABLED = "true"
RESEND_FROM = "Keva <accounts@usekeva.com>"
S3_ENDPOINT = "https://90203c49970ccbafedc99866c91c1b9f.r2.cloudflarestorage.com"
S3_REGION = "auto"
S3_BUCKET = "keva-production"
S3_FORCE_PATH_STYLE = "true"
POLAR_SERVER = "production"
POLAR_PRODUCT_100GB_ID = "e9c6cd24-8e57-49f8-813e-8071c8d664f5"
POLAR_PRODUCT_500GB_ID = "dae6fa43-b1bf-496b-a32a-ae26bdcbd4fa"
POLAR_PRODUCT_1TB_ID = "6cfbe810-174b-496d-b8f0-a3539fb2dd82"
POLAR_PRODUCT_2TB_ID = "a35ca8f9-6eae-4f8c-907c-2dabc443bab5"

[[env.production.routes]]
pattern = "app.usekeva.com"
custom_domain = true

[[env.production.routes]]
pattern = "api.usekeva.com"
custom_domain = true

[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "c0416888aeca4502b102d03467b26237"
